name: Unreal Engine 5 CI/CD

on:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: unreal-release
  cancel-in-progress: true

env:
  PROJECT_NAME: MyUnrealGame
  PROJECT_FILE: MyUnrealGame.uproject
  BUILD_CONFIGURATION: Shipping
  BUILD_PLATFORM: Win64
  ARCHIVE_NAME: MyUnrealGame-Windows
  UE_PATH: C:\Program Files\Epic Games\UE_5.4
  PACKAGE_DIR: Package
  DDC_PATH: C:\UnrealDDC

jobs:
  build:
    name: Build Unreal Engine 5
    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Enable Long Paths
        shell: powershell
        run: |
          git config --system core.longpaths true

      - name: Restore DerivedDataCache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DDC_PATH }}
          key: unreal-ddc-${{ hashFiles('Content/**/*.uasset') }}
          restore-keys: |
            unreal-ddc-

      - name: Restore Intermediate Cache
        uses: actions/cache@v4
        with:
          path: |
            Intermediate
            Saved
          key: unreal-intermediate-${{ github.ref_name }}
          restore-keys: |
            unreal-intermediate-

      - name: Generate Version
        id: version
        shell: powershell
        run: |
          $versionFile = "build_version.txt"

          if (!(Test-Path $versionFile)) {
              "0.0.0" | Out-File $versionFile
          }

          $version = Get-Content $versionFile
          $parts = $version.Split('.')

          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          $patch++

          $newVersion = "$major.$minor.$patch"

          Set-Content $versionFile $newVersion

          echo "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit Version
        shell: powershell
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add build_version.txt

          git diff --cached --quiet || git commit -m "Build version ${{ steps.version.outputs.version }}"

          git push

      - name: BuildCookRun
        shell: cmd
        run: |
          "%UE_PATH%\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun ^
          -project="%CD%\%PROJECT_FILE%" ^
          -noP4 ^
          -utf8output ^
          -platform=%BUILD_PLATFORM% ^
          -clientconfig=%BUILD_CONFIGURATION% ^
          -serverconfig=%BUILD_CONFIGURATION% ^
          -cook ^
          -allmaps ^
          -build ^
          -stage ^
          -pak ^
          -archive ^
          -package ^
          -compressed ^
          -prereqs ^
          -iostore ^
          -ddc=InstalledDerivedDataBackendGraph ^
          -unattended ^
          -nop4 ^
          -CrashReporter ^
          -archivedirectory="%CD%\%PACKAGE_DIR%"

      - name: Compress Build
        shell: powershell
        run: |
          Compress-Archive \
            -Path "${{ env.PACKAGE_DIR }}\*" \
            -DestinationPath "${{ env.ARCHIVE_NAME }}-${{ steps.version.outputs.version }}.zip" \
            -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: '*.zip'
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Unreal Engine Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Discord Notification
        shell: powershell
        run: |
          $payload = @{
              username = "UE5 Build Bot"
              content = "✅ New Unreal Engine 5 build released : v${{ steps.version.outputs.version }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.DISCORD_WEBHOOK }}" `
            -Method POST `
            -Body $payload `
            -ContentType 'application/json'